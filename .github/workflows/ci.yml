name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python training and CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[export]'
      - name: Check Python syntax
        run: python -m compileall -q python scripts
      - name: Run Rust tests
        run: cargo test --locked --all-targets
      - name: Build game binaries
        run: cargo build --release --locked --bins
      - name: Locate ONNX Runtime
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import onnxruntime

          capi = Path(onnxruntime.__file__).resolve().parent / "capi"
          libraries = sorted(capi.glob("libonnxruntime.so*"))
          if not libraries:
              raise SystemExit("ONNX Runtime shared library not found")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ORT_DYLIB_PATH={libraries[0]}\n")
          PY
      - name: Run CPU self-play, training, export, and arena smoke check
        run: python scripts/run_teacher_iteration.py --config configs/smoke.json
